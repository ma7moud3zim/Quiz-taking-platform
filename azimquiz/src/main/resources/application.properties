spring.application.name=azimquiz
# Set root logging level to WARN (shows only WARN, ERROR, FATAL)
logging.level.root=WARN
# Optionally silence specific packages (e.g., Hibernate, Tomcat)
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
spring.main.banner-mode=off

spring.datasource.url=jdbc:mysql://localhost:3306/quiz_azim_db
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

