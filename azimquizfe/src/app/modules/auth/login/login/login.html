<div class="bg" style="background-color: #F8F8F8">
  <div class="parent">
    <div class="child">
      <div nz-row class="imgDiv">
        <h1 style="margin-left: 100px"> Login </h1>
      </div>

      <form nz-form [formGroup]="validateForm" class="login-form" (ngSubmit)="submitForm()">
          <nz-form-item>
            <nz-form-control nzHasFeedback nzErrorTip="The input is not valid E-mail">
              <input nz-input placeholder="E-mail" formControlName="email"/>
            </nz-form-control>
          </nz-form-item>

          <nz-form-item>
            <nz-form-control nzHasFeedback nzErrorTip="The input is not valid Password!">
              <input nz-input placeholder="Password" type="password" formControlName="password"/>
            </nz-form-control>
          </nz-form-item>

          <button nz-button class="login-form-button" nzType="primary">Log in</button>
          Or <a routerLink="/register"> Register now!</a>
      </form>


    </div>
  </div>
