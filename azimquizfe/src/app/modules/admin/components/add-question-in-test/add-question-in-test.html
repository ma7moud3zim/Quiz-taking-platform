<div class="parent">
  <div class="child">
    <form nz-form [formGroup]="questionForm" class="login-form">
      <nz-form-label [nzNoColon]="'true'">Question Title</nz-form-label>
      <nz-form-item>
        <nz-form-control  nzErrorTip="This input is required!">
          <input type="text" nz-input formControlName="questionText" placeholder="Question Title" />
        </nz-form-control>
      </nz-form-item>

      <nz-form-label [nzNoColon]="'true'">Option A</nz-form-label>
      <nz-form-item>
        <nz-form-control  nzErrorTip="This input is required!">
          <input type="text" nz-input formControlName="OptionA" placeholder="Option A" />
        </nz-form-control>
      </nz-form-item>

      <nz-form-label [nzNoColon]="'true'">Option B</nz-form-label>
      <nz-form-item>
        <nz-form-control  nzErrorTip="This input is required!">
          <input type="text" nz-input formControlName="OptionB" placeholder="Option B" />
        </nz-form-control>
      </nz-form-item>

      <nz-form-label [nzNoColon]="'true'">Option C</nz-form-label>
      <nz-form-item>
        <nz-form-control  nzErrorTip="This input is required!">
          <input type="text" nz-input formControlName="OptionC" placeholder="Option C" />
        </nz-form-control>
      </nz-form-item>

      <nz-form-label [nzNoColon]="'true'">Option D</nz-form-label>
      <nz-form-item>
        <nz-form-control  nzErrorTip="This input is required!">
          <input type="text" nz-input formControlName="OptionD" placeholder="Option D" />
        </nz-form-control>
      </nz-form-item>

      <nz-form-label [nzNoColon]="'true'">Correct Answer</nz-form-label>
      <nz-form-item>
        <nz-form-control  nzErrorTip="This input is required!">
          <input type="text" nz-input formControlName="correctAnswer" placeholder="Correct Answer" />
        </nz-form-control>
      </nz-form-item>

      <div style="padding-bottom: 30px;">
        <button nz-button class="login-form-button login-form-margin" [nzType]="'primary'">Add Question</button>
       </div>
    </form>

  </div>
</div>
