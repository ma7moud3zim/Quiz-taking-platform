<div class="results-card">
  <div class="results-header">
    <h2 style="color: white; font-size: 35px; font-weight: 400">📊 Your Quiz Results</h2>
    <p>Performance overview</p>
  </div>

  <nz-table #basicTable [nzData]="dataSet" class="elegant-table">
    <thead>
      <tr>
        <th>📘 Test Name</th>
        <th>❓ Total Questions</th>
        <th>✅ Correct Answers</th>
        <th>🏆 Percentage</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let data of basicTable.data">
        <td>{{ data.testName }}</td>
        <td>{{ data.totalQuestions }}</td>
        <td>{{ data.correctAnswers }}</td>
        <td class="percentage-cell">{{ data.percentage }}%</td>
      </tr>
    </tbody>
  </nz-table>

  <div class="results-footer">
    <small>✨ Keep practicing to improve your scores ✨</small>
  </div>
</div>
