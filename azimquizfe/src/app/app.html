<div *ngIf="!isUserLoggedIn && !isAdminLoggedIn">
  <nz-header class="main-header" nz-row nzType="flex" style="background-color: #42644e">
    <div>
      <a class="logo" routerLink="/">Azim Quiz</a>
    </div>
    <div class="nav-links">
      <a nz-button nzType="link" routerLink="/register" routerLinkActive="active">Sign Up</a>
      <a nz-button nzType="link" routerLink="/login" routerLinkActive="active">Login</a>
    </div>
  </nz-header>
</div>

<div *ngIf="isAdminLoggedIn">
  <nz-header class="main-header" nz-row nzType="flex" style="background-color: #42644e">
    <div>
      <a class="logo" routerLink="/admin/dashboard">Azim Quiz</a>
    </div>
    <div class="nav-links">
      <a
        nz-button
        nzType="link"
        routerLink="/admin/dashboard"
        routerLinkActive="active"
        (click)="forceReflow()"
        >Dashboard</a
      >
      <a nz-button nzType="link" routerLink="/admin/create-test" routerLinkActive="active"
        >Create Test</a
      >
      <a nz-button nzType="link" routerLink="/admin/view-test-results" routerLinkActive="active"
        >View Results</a
      >
      <a nz-button nzType="link" (click)="logout()" routerLinkActive="active">Logout</a>
    </div>
  </nz-header>
</div>

<div *ngIf="isUserLoggedIn">
  <nz-header class="main-header" nz-row nzType="flex" style="background-color: #42644e">
    <div>
      <a class="logo" routerLink="/user/dashboard">Azim Quiz</a>
    </div>
    <div class="nav-links">
      <a
        nz-button
        nzType="link"
        routerLink="/user/dashboard"
        routerLinkActive="active"
        (click)="forceReflow()"
        >Dashboard</a
      >
      <a nz-button nzType="link" routerLink="/user/view-results" routerLinkActive="active"
        >View Results</a
      >
      <a nz-button nzType="link" (click)="logout()" routerLinkActive="active">Logout</a>
    </div>
  </nz-header>
</div>

<router-outlet></router-outlet>
